<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Calculator</title>
</head>
<body>
        <div class="calculator">
            <div class="operand-1 grid-elem">
                <input type="text">
            </div>
            <select class="operation grid-elem">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            <div class="operand-2 grid-elem">
                <input type="text">
            </div>

            <button class="calculate grid-elem">подсчитать</button>

            <div class="results grid-elem"></div>
        </div>
</body>
</html>
